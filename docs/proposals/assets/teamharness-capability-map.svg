<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="930" viewBox="0 0 1800 930" role="img" aria-labelledby="title desc">
  <title id="title">Team Harness capability map</title>
  <desc id="desc">Team Harness maps harness carriers to team concerns: organize, message, share, and project task.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="organize" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f766e"/>
      <stop offset="100%" stop-color="#2d7f87"/>
    </linearGradient>
    <linearGradient id="message" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7523d"/>
      <stop offset="100%" stop-color="#d76d53"/>
    </linearGradient>
    <linearGradient id="share" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#276f39"/>
      <stop offset="100%" stop-color="#448452"/>
    </linearGradient>
    <linearGradient id="task" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b87920"/>
      <stop offset="100%" stop-color="#c58a2e"/>
    </linearGradient>
    <style>
      .page { fill: #f8faf8; }
      .title { font: 800 44px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .header-title { font: 800 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #fff; }
      .header-sub { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: rgba(255,255,255,0.82); }
      .row-title { font: 800 33px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #fff; }
      .row-sub { font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: rgba(255,255,255,0.76); }
      .cell-title { font: 800 29px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .cell-sub { font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #64717f; }
      .card { fill: #fff; stroke: #d8dedc; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="930" rx="18"/>
  <rect x="20" y="20" width="1760" height="890" rx="18" fill="#ffffff" stroke="#d8dedc" stroke-width="1.5"/>
  <text class="title" x="60" y="92">Team Harness = 能力承载 × 团队事务</text>

  <g filter="url(#shadow)">
    <rect x="60" y="128" width="220" height="104" rx="10" fill="url(#dark)"/>
    <text class="header-title" x="170" y="178" text-anchor="middle">能力承载</text>
    <text class="header-sub" x="170" y="214" text-anchor="middle">团队事务</text>

    <rect x="300" y="128" width="345" height="104" rx="10" fill="url(#organize)"/>
    <text class="header-title" x="324" y="176">Organize</text>
    <text class="header-sub" x="324" y="211">组织关系</text>

    <rect x="665" y="128" width="345" height="104" rx="10" fill="url(#message)"/>
    <text class="header-title" x="689" y="176">Message</text>
    <text class="header-sub" x="689" y="211">团队沟通</text>

    <rect x="1030" y="128" width="345" height="104" rx="10" fill="url(#share)"/>
    <text class="header-title" x="1054" y="176">Share</text>
    <text class="header-sub" x="1054" y="211">共享空间</text>

    <rect x="1395" y="128" width="345" height="104" rx="10" fill="url(#task)"/>
    <text class="header-title" x="1419" y="176">Project / Task</text>
    <text class="header-sub" x="1419" y="211">项目任务</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="252" width="220" height="142" rx="10" fill="url(#dark)"/>
    <text class="row-title" x="82" y="316">TEAMS.md</text>
    <text class="row-sub" x="82" y="356">写长期规则</text>

    <rect x="60" y="414" width="220" height="142" rx="10" fill="url(#dark)"/>
    <text class="row-title" x="82" y="478">Skills</text>
    <text class="row-sub" x="82" y="518">说明怎么做</text>

    <rect x="60" y="576" width="220" height="142" rx="10" fill="url(#dark)"/>
    <text class="row-title" x="82" y="640">MCP</text>
    <text class="row-sub" x="82" y="680">提供工具</text>

    <rect x="60" y="738" width="220" height="142" rx="10" fill="url(#dark)"/>
    <text class="row-title" x="82" y="802">Hooks</text>
    <text class="row-sub" x="82" y="842">自动执行</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="300" y="252" width="345" height="142" rx="10"/>
    <text class="cell-title" x="324" y="306">组织契约</text>
    <text class="cell-sub" x="324" y="347">角色关系</text>

    <rect class="card" x="665" y="252" width="345" height="142" rx="10"/>
    <text class="cell-title" x="689" y="306">沟通契约</text>
    <text class="cell-sub" x="689" y="347">房间和确认边界</text>

    <rect class="card" x="1030" y="252" width="345" height="142" rx="10"/>
    <text class="cell-title" x="1054" y="306">共享契约</text>
    <text class="cell-sub" x="1054" y="347">workspace 和资源引用</text>

    <rect class="card" x="1395" y="252" width="345" height="142" rx="10"/>
    <text class="cell-title" x="1419" y="306">任务契约</text>
    <text class="cell-sub" x="1419" y="347">状态、交付、验收</text>

    <rect class="card" x="300" y="414" width="345" height="142" rx="10"/>
    <text class="cell-title" x="324" y="468">角色边界</text>
    <text class="cell-sub" x="324" y="509">职责和协作方式</text>

    <rect class="card" x="665" y="414" width="345" height="142" rx="10"/>
    <text class="cell-title" x="689" y="468">沟通协议</text>
    <text class="cell-sub" x="689" y="509">Team Room / DM / mention</text>

    <rect class="card" x="1030" y="414" width="345" height="142" rx="10"/>
    <text class="cell-title" x="1054" y="468">共享约定</text>
    <text class="cell-sub" x="1054" y="509">产物、知识、引用</text>

    <rect class="card" x="1395" y="414" width="345" height="142" rx="10"/>
    <text class="cell-title" x="1419" y="468">任务流程</text>
    <text class="cell-sub" x="1419" y="509">计划到归档</text>

    <rect class="card" x="300" y="576" width="345" height="142" rx="10"/>
    <text class="cell-title" x="324" y="630">查组织</text>
    <text class="cell-sub" x="324" y="671">member / role / context</text>

    <rect class="card" x="665" y="576" width="345" height="142" rx="10"/>
    <text class="cell-title" x="689" y="630">发读消息</text>
    <text class="cell-sub" x="689" y="671">Matrix 消息和上下文</text>

    <rect class="card" x="1030" y="576" width="345" height="142" rx="10"/>
    <text class="cell-title" x="1054" y="630">读写文件</text>
    <text class="cell-sub" x="1054" y="671">shared 文件操作</text>

    <rect class="card" x="1395" y="576" width="345" height="142" rx="10"/>
    <text class="cell-title" x="1419" y="630">推进任务</text>
    <text class="cell-sub" x="1419" y="671">projectflow / taskflow</text>

    <rect class="card" x="300" y="738" width="345" height="142" rx="10"/>
    <text class="cell-title" x="324" y="792">注入上下文</text>
    <text class="cell-sub" x="324" y="833">推理前加载 TEAMS.md</text>

    <rect class="card" x="665" y="738" width="345" height="142" rx="10"/>
    <text class="cell-title" x="689" y="792">消息护栏</text>
    <text class="cell-sub" x="689" y="833">mention / NO_REPLY</text>

    <rect class="card" x="1030" y="738" width="345" height="142" rx="10"/>
    <text class="cell-title" x="1054" y="792">文件安全</text>
    <text class="cell-sub" x="1054" y="833">路径和凭据保护</text>

    <rect class="card" x="1395" y="738" width="345" height="142" rx="10"/>
    <text class="cell-title" x="1419" y="792">结果同步</text>
    <text class="cell-sub" x="1419" y="833">状态和摘要提示</text>
  </g>
</svg>
